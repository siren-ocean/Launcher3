plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace "com.android.settingslib.widget.theme"

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        buildConfig = false
    }

    sourceSets {
        main {
            res.srcDirs = ['res']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.preference
}