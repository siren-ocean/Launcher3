protobuf {
    // Configure the protoc executable
    protoc {
        artifact = libs.protoc.get()
    }
    // Configure the javalite plugin
    plugins {
        javalite {
            artifact = "com.google.protobuf:protoc-gen-javalite:3.0.0"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                remove java
            }
            task.plugins {
                javalite {}
            }
        }
    }
}

allprojects { project ->
    project.plugins.withId("com.android.library") {
        applyReorderRule(project)
        applyDefaultConfig(project)
        applyAidlWindowsPathFix(project)
    }
    project.plugins.withId("com.android.application") {
        applyReorderRule(project)
        applyDefaultConfig(project)
        applyAidlWindowsPathFix(project)
    }
}

def applyReorderRule(Project project) {
    project.gradle.projectsEvaluated {
        // 匹配所有 Java 编译任务，包括带 productFlavors 的任务
        project.tasks.matching { it.name.matches(/compile.*JavaWithJavac/) }.configureEach { task ->
            task.doFirst {
                task.classpath = reorderClasspath(task.classpath.files)
            }
        }
    }
}

def reorderClasspath(Set<File> classpathSet) {
    def androidJar = classpathSet.find { it.name == "android.jar" }
    def others = classpathSet - (androidJar ? [androidJar] : [])
    return files((others + (androidJar ?: [])).toArray())
}

def applyDefaultConfig(Project project) {
    project.android {
        compileSdk COMPILE_SDK.toInteger()

        defaultConfig {
            minSdk MIN_SDK_VERSION.toInteger()
            targetSdk TARGET_SDK_VERSION.toInteger()
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }
}

allprojects {
    tasks.withType(JavaCompile).configureEach { task ->
        task.doFirst {
            // 排除 Filter 模块
            if (!task.project.path.contains(":Filter")) {
                // 替换java.base
                options.compilerArgs += ["--patch-module", "java.base=${rootDir}/libs/core-all.jar"]
                // 允许访问 java.lang.runtime 包（Java record 需要）
                options.compilerArgs += ["--add-exports", "java.base/java.lang.runtime=ALL-UNNAMED"]
            }
        }
    }
}

// 解决注解在windows平台获取路径的时候，输出的分隔符为反斜杠，导致编译不通过
// AIDL on Windows emits file paths with backslashes inside Java string literals and
// comments (e.g. overrideSourcePosition="C:\Users\..."), which javac rejects.
def fixAidlGeneratedWindowsPaths(Project project) {
    if (!org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        return
    }
    def aidlDir = new File(project.buildDir, "generated/aidl_source_output_dir")
    if (!aidlDir.exists()) {
        return
    }
    aidlDir.eachFileRecurse { file ->
        if (!file.file || !file.name.endsWith('.java')) {
            return
        }
        def content = file.getText('UTF-8')
        def fixed = content.replaceAll(/overrideSourcePosition="([^"]*)"/) { match, path ->
            "overrideSourcePosition=\"${path.replace('\\', '/')}\""
        }
        fixed = fixed.replaceAll(/(?m)^(\s*\* Using: )(.*)$/) { match, prefix, path ->
            "${prefix}${path.replace('\\', '/')}"
        }
        if (content != fixed) {
            file.setText(fixed, 'UTF-8')
        }
    }
}

def applyAidlWindowsPathFix(Project project) {
    project.gradle.projectsEvaluated {
        project.tasks.configureEach { task ->
            // Run immediately before any compilation that reads AIDL output. AIDL task names
            // vary across AGP versions, and outputs can be regenerated after compile*Aidl.
            if (task.name ==~ /compile.*Aidl/
                    || task.name ==~ /compile.*JavaWithJavac/
                    || task.name ==~ /kapt.*Kotlin/) {
                task.doFirst {
                    fixAidlGeneratedWindowsPaths(project)
                }
            }
        }
    }
}